[project]
name = "freshcart-pipelines"
version = "0.1.0"
description = "Data Engineering assignment: ELT, ML pipelines, and event streaming end to end."
requires-python = ">=3.10"

dependencies = [
    # Snowflake
    "snowflake-connector-python>=3.6.0",

    # ML / training
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",

    # Messaging
    "pika>=1.3.2",

    # Utilities
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
